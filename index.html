<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติ Error รถ EV — TPI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fbfbfd;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-dim: #86868b;
    --line: #d2d2d7;
    --blue: #0071e3;
    --blue-dim: #0077ed;
    --red: #d70015;
    --green: #1a7f37;
    --orange: #c2650a;
    --purple: #8944ab;
    --teal: #0a7a8c;
    --gray: #6e6e73;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --sans: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}

  .nav{
    position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(180%) blur(20px);
    background:rgba(251,251,253,.82);
    border-bottom:1px solid var(--line);
    padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .nav h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .nav .updated{font-size:12px;color:var(--text-dim);margin-right:auto;}
  .iconbtn{
    border:none;background:var(--card);border:1px solid var(--line);color:var(--text);
    width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .iconbtn:hover{background:#f2f2f4;}
  .iconbtn.spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .hero{padding:38px 24px 8px;max-width:980px;margin:0 auto;text-align:center;}
  .hero h2{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;}
  .hero p{font-size:16px;color:var(--text-dim);margin:0;}

  .stats{
    max-width:980px;margin:26px auto 0;padding:0 24px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  }
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;text-align:center;
  }
  .stat-card b{font-size:28px;font-weight:600;display:block;letter-spacing:-.01em;}
  .stat-card span{font-size:12.5px;color:var(--text-dim);}

  .toolbar{
    max-width:980px;margin:20px auto 0;padding:0 24px;
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .search{flex:1;min-width:200px;position:relative;}
  .search input{
    width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);
    padding:11px 14px 11px 38px;border-radius:12px;font-size:14.5px;font-family:var(--sans);
  }
  .search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:16px;}
  select{
    background:var(--card);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;border-radius:12px;font-size:14px;font-family:var(--sans);
  }
  input:focus, select:focus{outline:2px solid var(--blue);outline-offset:1px;}

  .tabbar{
    max-width:980px;margin:14px auto 0;padding:0 24px;
  }
  .tabbar-inner{
    background:#f2f2f4;border-radius:12px;padding:4px;display:flex;gap:4px;
  }
  .tab-btn{
    flex:1;border:none;background:transparent;padding:9px 4px;border-radius:9px;
    font-size:13.5px;font-weight:500;color:var(--text-dim);cursor:pointer;
    transition:.15s;font-family:var(--sans);
  }
  .tab-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}

  .subpanel{max-width:980px;margin:14px auto 0;padding:0 24px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;max-height:230px;overflow-y:auto;padding:2px 2px 8px;}
  .chip-select{
    padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;
    border:1.5px solid transparent;background:#efeff0;color:var(--text-dim);
    display:inline-flex;align-items:center;gap:6px;transition:.12s;
  }
  .chip-select .n{font-weight:400;opacity:.7;}
  .chip-select.sel-hv{background:#fde7e9;color:var(--red);}
  .chip-select.sel-lv{background:#e5f1ff;color:var(--blue);}
  .chip-select.sel-bms{background:#e6f6ea;color:var(--green);}
  .chip-select.sel-motor{background:#fdf0e2;color:var(--orange);}
  .chip-select.sel-charge{background:#f4e9fa;color:var(--purple);}
  .chip-select.sel-brake{background:#e6f5f6;color:var(--teal);}
  .chip-select.sel-other{background:#efeff0;color:var(--gray);}
  .chip-select.active{border-color:currentColor;}
  .chip-select.vehicle{background:#f5f5f7;color:var(--text);}
  .chip-select.vehicle.active{border-color:var(--blue);color:var(--blue);background:#e5f1ff;}
  .history-note{font-size:12.5px;color:var(--text-dim);padding:2px 2px 4px;}

  .diagram-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--text);transition:.12s;
  }
  .diagram-row:hover{border-color:#b0b0b5;box-shadow:var(--shadow);}
  .diagram-icon{
    width:38px;height:38px;border-radius:9px;background:#fde7e9;color:var(--red);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
  }
  .diagram-title{font-size:14.5px;font-weight:500;}
  .diagram-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .diagram-section-title{
    font-size:12.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;
    letter-spacing:.03em;margin:18px 0 8px;
  }
  .diagram-section-title:first-child{margin-top:0;}

  .diagram-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px;}
  .diagram-chip{
    text-decoration:none;padding:7px 13px;font-size:12.5px;
  }

  main{max-width:980px;margin:0 auto;padding:18px 24px 70px;}

  .state{text-align:center;padding:70px 20px;color:var(--text-dim);}
  .state h3{color:var(--text);font-size:17px;font-weight:600;margin:0 0 6px;}
  .state p{margin:0;font-size:14px;line-height:1.6;}
  .state code{background:#f2f2f4;padding:2px 7px;border-radius:6px;font-size:12.5px;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .row-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;cursor:pointer;transition:.12s;
  }
  .row-card:hover{border-color:#b0b0b5;box-shadow:var(--shadow);}
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .row-tpi{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .row-date{font-size:12.5px;color:var(--text-dim);white-space:nowrap;text-align:right;}
  .row-symptom{font-size:14.5px;margin:8px 0 10px;line-height:1.5;color:#3a3a3c;}
  .row-bottom{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .chip{
    display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;
    font-size:12px;font-weight:600;
  }
  .chip.hv{background:#fde7e9;color:var(--red);}
  .chip.lv{background:#e5f1ff;color:var(--blue);}
  .chip.bms{background:#e6f6ea;color:var(--green);}
  .chip.motor{background:#fdf0e2;color:var(--orange);}
  .chip.charge{background:#f4e9fa;color:var(--purple);}
  .chip.brake{background:#e6f5f6;color:var(--teal);}
  .chip.other{background:#efeff0;color:var(--gray);}
  .chip.unset{background:transparent;border:1px dashed var(--line);color:var(--text-dim);font-weight:500;}
  .chip.code{background:#f2f2f4;color:#3a3a3c;font-family:ui-monospace,monospace;}
  .chip.recur{background:#fff4e5;color:#a15c00;}

  .status{font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px;margin-left:auto;}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;}
  .status.ok::before{background:var(--green);}
  .status.bad::before{background:var(--red);}
  .status.mid::before{background:var(--orange);}

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;
    align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  @media(min-width:640px){ .sheet-overlay{align-items:center;} }
  .sheet{
    background:var(--card);width:100%;max-width:520px;max-height:86vh;
    border-radius:20px 20px 0 0;overflow-y:auto;
    transform:translateY(30px);opacity:0;transition:.2s;
  }
  @media(min-width:640px){ .sheet{border-radius:20px;} }
  .sheet-overlay.show .sheet{transform:translateY(0);opacity:1;}
  .sheet-head{padding:22px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);}
  .sheet-head h2{margin:0 0 4px;font-size:19px;font-weight:600;}
  .sheet-head p{margin:0;font-size:13px;color:var(--text-dim);}
  .sheet-close{position:absolute;top:18px;right:18px;background:#f2f2f4;border:none;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--text-dim);}
  .sheet-body{padding:18px 24px 30px;}
  .kv{margin-bottom:16px;}
  .kv label{display:block;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .kv .v{font-size:15px;line-height:1.55;}
  .edit-link{
    display:block;margin-top:6px;padding:12px 16px;background:#f2f2f4;border-radius:12px;
    text-align:center;color:var(--blue);font-size:13.5px;font-weight:500;text-decoration:none;
  }

  .tpi-link, .code-link{
    cursor:pointer;text-decoration:none;color:inherit;border-bottom:1px dashed transparent;
  }
  .tpi-link:hover, .code-link:hover{color:var(--blue);border-bottom-color:var(--blue);}
  .sheet-wide .sheet{max-width:640px;}
  .sheet-back{
    background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;
    padding:0 0 10px;display:flex;align-items:center;gap:4px;
  }
  .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 20px;}
  .profile-stats .pstat{background:#f5f5f7;border-radius:12px;padding:12px;text-align:center;}
  .profile-stats .pstat b{display:block;font-size:20px;font-weight:600;}
  .profile-stats .pstat span{font-size:11px;color:var(--text-dim);}
  .profile-section{margin-bottom:26px;}
  .profile-section h4{font-size:13px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;}
  .chart-box{position:relative;height:180px;margin-bottom:6px;}
  .mini-list{display:flex;flex-direction:column;gap:8px;}
  .mini-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#f5f5f7;border-radius:12px;padding:11px 14px;cursor:pointer;
  }
  .mini-row:hover{background:#ececee;}
  .mini-row .mr-main{font-size:14px;font-weight:500;}
  .mini-row .mr-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .mini-row .mr-count{font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap;}
</style>
</head>
<body>
<div class="nav">
  <h1>ประวัติ Error รถ EV</h1>
  <span class="updated" id="updatedAt">กำลังโหลด...</span>
  <button class="iconbtn" id="refreshBtn" title="รีเฟรชข้อมูล">⟳</button>
</div>

<div class="hero">
  <h2>ค้นหาประวัติ error รถ EV</h2>
  <p>อาการ · สาเหตุ · วิธีแก้ไข — อัพเดทจาก Google Sheet ของทีม</p>
</div>

<div class="toolbar">
  <div class="search"><input id="searchInput" placeholder="พิมพ์หลาย keyword คั่นด้วยเว้นวรรค เช่น 09-514 E101"></div>
</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-tab="system">ระบบ</button>
    <button class="tab-btn" data-tab="vehicle">รถทั้งหมด</button>
    <button class="tab-btn" data-tab="history">ประวัติ</button>
    <button class="tab-btn" data-tab="diagram">วงจรไฟ</button>
  </div>
</div>

<div class="subpanel" id="subPanel"></div>

<main>
  <div class="state" id="stateBox" style="display:none"></div>
  <div class="list" id="list"></div>
</main>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetEl">
    <div class="sheet-head">
      <button class="sheet-close" id="sheetClose">✕</button>
      <button class="sheet-back" id="sheetBack" style="display:none">‹ กลับ</button>
      <h2 id="shTpi">—</h2>
      <p id="shSub">—</p>
    </div>
    <div class="sheet-body" id="shBody"></div>
  </div>
</div>

<script>
/* ตั้งค่าลิงก์ CSV จาก Google Sheet (File > Share > Publish to web > CSV) ตรงนี้ */
const DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7fagcTTmH5KHHLAgUulQEVldSmfPIrnDeekJ9YxCPFXi43bY_1IwgPUFTUYP3cR08WuaElJc5vHHE/pub?gid=0&single=true&output=csv";
const params = new URLSearchParams(location.search);
const CSV_URL = params.get('csv') || DEFAULT_CSV_URL;
const SHEET_EDIT_URL = params.get('edit') || "";

/* รายการไฟล์วงจรไฟ (PDF) — เพิ่มทีละรายการที่นี่หลังอัพโหลดไฟล์เข้าโฟลเดอร์ diagrams/ ใน repo เดียวกัน
   title = ชื่อที่จะแสดงในเว็บ, file = path ของไฟล์ (ตรงกับชื่อไฟล์ที่อัพโหลดจริง)
   type  = "HV" | "LV" | "FUSE" | "COOLING" | "OTHER" (กำหนดสีไอคอน)
   prefixes = LOT/รุ่นที่ใช้ไฟล์นี้ — ใส่ตัวเลขก่อนขีดของ TPI Code เช่น "09-518" prefix คือ "09"
   vehicles = ใช้แทน prefixes ถ้าไฟล์นี้ใช้ได้กับรถบางคันเท่านั้น (ไม่ใช่ทั้ง LOT) — ใส่ TPI Code เต็มๆ
   ถ้าไม่ใส่ทั้ง prefixes และ vehicles เลย = ไฟล์นี้ใช้ได้กับรถทุกคัน */
const DIAGRAM_FILES = [
  { title: "วงจร Fuse box", file: "diagrams/fuse-box-lot3.pdf", type: "FUSE",
    vehicles: ["09-504","09-511","09-514","09-515","09-523","09-524","09-527","09-502","09-608"] },
  { title: "วงจร Cooling", file: "diagrams/LOT3_H55_Cooling.pdf", type: "COOLING",
    vehicles: ["09-514","09-515","09-502","09-608"] },
  { title: "วงจร HV", file: "diagrams/LOT3_Backhoe_HV.pdf", type: "HV",
    vehicles: ["09-504","09-511","09-514","09-515","09-523","09-524","09-527","09-502","09-608"] },
  { title: "วงจร LV .dwg", file: "diagrams/LOT3_H55_LV.dwg", type: "LV",
    vehicles: ["09-514","09-515","09-502","09-608"] },
];
const DIAGRAM_TYPE_CLASS = {HV:'hv', LV:'lv', FUSE:'motor', COOLING:'brake', OTHER:'other'};
function getDiagramsForTpi(tpiCode){
  const prefix = (tpiCode||'').split('-')[0];
  return DIAGRAM_FILES.filter(d=>{
    if(d.vehicles && d.vehicles.length) return d.vehicles.includes(tpiCode);
    if(d.prefixes && d.prefixes.length) return d.prefixes.includes(prefix);
    return true;
  });
}
function diagramChipsHtml(tpiCode){
  const items = getDiagramsForTpi(tpiCode);
  if(!items.length) return '';
  return `<div class="diagram-chip-row">${items.map(d=>{
    const cls = DIAGRAM_TYPE_CLASS[d.type] || 'other';
    return `<a class="chip diagram-chip ${cls}" href="${d.file}" target="_blank" rel="noopener">📄 ${d.title}</a>`;
  }).join('')}</div>`;
}

const SYSTEM_META = {
  'HV': {l:'HV แรงดันสูง', cls:'hv'},
  'LV': {l:'LV แรงดันต่ำ', cls:'lv'},
  'BMS': {l:'BMS', cls:'bms'},
  'MOTOR': {l:'Motor/Inverter', cls:'motor'},
  'CHARGE': {l:'ระบบชาร์จ', cls:'charge'},
  'BRAKE': {l:'ระบบเบรก', cls:'brake'},
  'OTHER': {l:'อื่นๆ', cls:'other'},
};
const HEADER_MAP = [
  {key:'id', matches:['id','ลำดับ']},
  {key:'date', matches:['วันที่']},
  {key:'timeFrom', matches:['เวลาจาก']},
  {key:'timeTo', matches:['เวลาถึง']},
  {key:'tpiCode', matches:['tpi code','tpi','รหัสรถ']},
  {key:'workOrder', matches:['work order','ใบสั่งงาน']},
  {key:'symptom', matches:['อาการ','รายละเอียด']},
  {key:'errorCode', matches:['error code','error']},
  {key:'rootCauseInitial', matches:['สาเหตุ']},
  {key:'fixMethod', matches:['วิธีแก้ไข','วิธีแก้']},
  {key:'technician', matches:['ผู้ซ่อม','ช่าง']},
  {key:'resultStatus', matches:['ผลการซ่อม','ผล']},
  {key:'system', matches:['ระบบ']},
  {key:'component', matches:['อุปกรณ์']},
  {key:'resolvedPermanent', matches:['แก้หาย','ถาวร']},
];

let records = [];

function showState(html){
  document.getElementById('stateBox').style.display = 'block';
  document.getElementById('stateBox').innerHTML = html;
  document.getElementById('list').innerHTML = '';
}
function hideState(){ document.getElementById('stateBox').style.display = 'none'; }

function mapRow(row, headers){
  const rec = {};
  HEADER_MAP.forEach(f=>{
    let h = headers.find(x => f.matches.some(m => x.toLowerCase().trim() === m));
    if(!h) h = headers.find(x => f.matches.some(m => x.toLowerCase().includes(m)));
    rec[f.key] = h ? String(row[h] ?? '').trim() : '';
  });
  return rec;
}

async function loadData(isRefresh){
  const btn = document.getElementById('refreshBtn');
  if(isRefresh) btn.classList.add('spin');
  if(!CSV_URL){
    showState(`<h3>ยังไม่ได้ตั้งค่าแหล่งข้อมูล</h3>
      <p>ต้องเชื่อมกับ Google Sheet ที่ Publish to web แบบ CSV แล้วนำลิงก์มาใส่ในหน้านี้ก่อน<br>ติดต่อผู้ดูแล dashboard นี้เพื่อตั้งค่า</p>`);
    if(isRefresh) btn.classList.remove('spin');
    return;
  }
  try{
    const res = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    if(!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ (HTTP ' + res.status + ')');
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    const headers = parsed.meta.fields || [];
    records = parsed.data.map(row => mapRow(row, headers)).filter(r => r.id);
    document.getElementById('updatedAt').textContent = 'อัพเดทล่าสุด ' + new Date().toLocaleString('th-TH', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
    hideState();
    render();
  }catch(e){
    showState(`<h3>โหลดข้อมูลไม่สำเร็จ</h3><p>${e.message}<br>ตรวจสอบว่า Google Sheet ยังแชร์แบบ Publish to web (CSV) อยู่ และลองกดปุ่มรีเฟรชอีกครั้ง</p>`);
  }
  if(isRefresh) btn.classList.remove('spin');
}
document.getElementById('refreshBtn').addEventListener('click', ()=>loadData(true));

function sysMeta(v){ return SYSTEM_META[v]; }
function statusClass(status){
  if(!status) return 'mid';
  if(status.includes('ไม่เสร็จ')) return 'bad';
  if(status.includes('เสร็จ')||status.includes('ปล่อยใช้งาน')) return 'ok';
  return 'mid';
}
function errorCodeCounts(){
  const map = {};
  records.forEach(r=>{
    if(!r.errorCode) return;
    const key = (r.tpiCode||'')+'|'+r.errorCode;
    map[key] = (map[key]||0)+1;
  });
  return map;
}

let activeTab = 'system';
let selectedSystem = '';
let selectedTpi = '';

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
});

function renderSubPanel(){
  const panel = document.getElementById('subPanel');
  if(activeTab === 'system'){
    const counts = {};
    records.forEach(r=>{ const k=r.system||'UNSET'; counts[k]=(counts[k]||0)+1; });
    const keys = Object.keys(SYSTEM_META).filter(k=>counts[k]);
    panel.innerHTML = `<div class="chip-grid">${keys.map(k=>{
      const m = SYSTEM_META[k];
      const isActive = selectedSystem===k;
      return `<button class="chip-select sel-${m.cls} ${isActive?'active':''}" data-sys="${k}">${m.l} <span class="n">${counts[k]}</span></button>`;
    }).join('')}</div>`;
    panel.querySelectorAll('[data-sys]').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedSystem = selectedSystem===el.dataset.sys ? '' : el.dataset.sys;
        render();
      });
    });
  }else if(activeTab === 'vehicle'){
    const counts = {};
    records.forEach(r=>{ if(r.tpiCode) counts[r.tpiCode]=(counts[r.tpiCode]||0)+1; });
    const tpis = Object.keys(counts).sort();
    panel.innerHTML = `<div class="chip-grid">${tpis.map(t=>{
      const isActive = selectedTpi===t;
      return `<button class="chip-select vehicle ${isActive?'active':''}" data-tpi="${t}">${t} <span class="n">${counts[t]}</span></button>`;
    }).join('')}</div>`;
    panel.querySelectorAll('[data-tpi]').forEach(el=>{
      el.addEventListener('click', ()=>{
        selectedTpi = selectedTpi===el.dataset.tpi ? '' : el.dataset.tpi;
        render();
      });
    });
  }else if(activeTab === 'history'){
    panel.innerHTML = `<div class="history-note">แสดงประวัติทั้งหมดเรียงจากล่าสุด</div>`;
  }else{
    panel.innerHTML = `<div class="history-note">ไฟล์วงจรไฟสำหรับทีมหน้างาน — กดเพื่อเปิดดู PDF</div>`;
  }
}

function render(){
  renderSubPanel();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  if(activeTab === 'diagram'){
    const list = document.getElementById('list');
    const tokens = q.split(/\s+/).filter(Boolean);
    const filtered = DIAGRAM_FILES.filter(d=>{
      const hay = [d.title, ...(d.vehicles||[]), ...(d.prefixes||[])].join(' ').toLowerCase();
      return tokens.every(t => hay.includes(t));
    });
    if(DIAGRAM_FILES.length === 0){
      hideState();
      list.innerHTML = `<div class="state" style="display:block"><h3>ยังไม่มีไฟล์วงจรไฟ</h3><p>ผู้ดูแลเว็บยังไม่ได้เพิ่มไฟล์ PDF ไว้ในหมวดนี้</p></div>`;
      return;
    }
    if(filtered.length === 0){
      hideState();
      list.innerHTML = `<div class="state" style="display:block"><h3>ไม่พบผลลัพธ์</h3><p>ลองปรับคำค้นหา</p></div>`;
      return;
    }
    hideState();
    const typeOrder = ['FUSE','HV','LV','COOLING','OTHER'];
    const typeLabel = {FUSE:'Fuse Box', HV:'HV แรงดันสูง', LV:'LV แรงดันต่ำ', COOLING:'Cooling น้ำหล่อเย็น', OTHER:'อื่นๆ'};
    const groups = {};
    filtered.forEach(d=>{ const t = d.type || 'OTHER'; (groups[t] = groups[t]||[]).push(d); });
    const scope = d => {
      if(d.vehicles && d.vehicles.length) return `ใช้กับ ${d.vehicles.length} คัน: ${d.vehicles.join(', ')}`;
      if(d.prefixes && d.prefixes.length) return `LOT ${d.prefixes.join(', ')}`;
      return 'ใช้ได้ทุกคัน';
    };
    list.innerHTML = typeOrder.filter(t=>groups[t]).map(t => `
      <div class="diagram-section-title">${typeLabel[t]}</div>
      <div class="list" style="margin-bottom:18px;">
        ${groups[t].map(d => `
          <a class="diagram-row" href="${d.file}" target="_blank" rel="noopener">
            <div class="diagram-icon">${(d.file.split('.').pop()||'FILE').toUpperCase()}</div>
            <div><div class="diagram-title">${d.title}</div><div class="diagram-sub">${scope(d)}</div></div>
          </a>`).join('')}
      </div>`).join('');
    return;
  }

  const counts = errorCodeCounts();

  let base = records;
  let showList = false;

  if(activeTab === 'history'){
    showList = true;
  }else if(activeTab === 'system' && selectedSystem){
    base = base.filter(r => r.system === selectedSystem);
    showList = true;
  }else if(activeTab === 'vehicle' && selectedTpi){
    base = base.filter(r => r.tpiCode === selectedTpi);
    showList = true;
  }

  if(q){
    const tokens = q.split(/\s+/).filter(Boolean);
    base = base.filter(r=>{
      const hay = [r.tpiCode,r.errorCode,r.symptom,r.component,r.rootCauseInitial,r.fixMethod,r.technician].join(' ').toLowerCase();
      return tokens.every(t => hay.includes(t));
    });
    showList = true;
  }

  base = [...base].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.timeFrom||'').localeCompare(a.timeFrom||''));

  const list = document.getElementById('list');
  if(records.length === 0){
    showState(`<h3>ยังไม่มีข้อมูล</h3><p>ยังไม่พบแถวข้อมูลใน Google Sheet ที่เชื่อมไว้ ตรวจสอบว่ามีข้อมูลและหัวคอลัมน์ถูกต้อง</p>`);
    return;
  }
  if(!showList){
    hideState();
    list.innerHTML = `<div class="state" style="display:block"><h3>พิมพ์ keyword ที่ต้องการค้นหา</h3><p>หรือเลือกระบบ / เลือกรถจากแถบด้านบน หรือไปที่แท็บ "ประวัติ" เพื่อดูทั้งหมด</p></div>`;
    return;
  }
  if(base.length === 0){
    hideState();
    list.innerHTML = `<div class="state" style="display:block"><h3>ไม่พบผลลัพธ์</h3><p>ลองปรับคำค้นหาหรือตัวเลือก</p></div>`;
    return;
  }
  hideState();

  list.innerHTML = base.map(r=>{
    const meta = sysMeta(r.system);
    const sysChip = meta ? `<span class="chip ${meta.cls}">${meta.l}</span>` : `<span class="chip unset">ยังไม่ระบุระบบ</span>`;
    const key = (r.tpiCode||'')+'|'+r.errorCode;
    const isRecur = r.errorCode && counts[key] >= 2;
    return `<div class="row-card" data-id="${r.id}">
      <div class="row-top">
        <div class="row-tpi"><span class="tpi-link" data-tpi="${r.tpiCode}">${r.tpiCode||'—'}</span></div>
        <div class="row-date">${r.date||''}${r.timeFrom?' · '+r.timeFrom:''}</div>
      </div>
      <div class="row-symptom">${r.symptom || '—'}</div>
      <div class="row-bottom">
        ${sysChip}
        ${r.errorCode ? `<span class="chip code code-link" data-code="${r.errorCode}">${r.errorCode}</span>` : ''}
        ${isRecur ? `<span class="chip recur">ซ้ำ ${counts[key]}×</span>` : ''}
        <span class="status ${statusClass(r.resultStatus)}">${r.resultStatus||'—'}</span>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.row-card').forEach(el=>{
    el.addEventListener('click', ()=> openSheet(el.dataset.id));
  });
  list.querySelectorAll('.tpi-link').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); openVehicleProfile(el.dataset.tpi); });
  });
  list.querySelectorAll('.code-link').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); openErrorProfile(el.dataset.code); });
  });
}

let activeCharts = [];
function clearCharts(){ activeCharts.forEach(c=>c.destroy()); activeCharts = []; }
function safeChart(canvasId, config){
  try{
    const el = document.getElementById(canvasId);
    if(!el || typeof Chart === 'undefined') return;
    activeCharts.push(new Chart(el, config));
  }catch(e){ /* chart lib unavailable — rest of the page still works */ }
}

let sheetStack = [];
function pushSheet(renderFn){
  sheetStack.push(renderFn);
  document.getElementById('sheetOverlay').classList.add('show');
  try{
    renderFn();
  }catch(e){
    document.getElementById('shBody').innerHTML = `<div class="state" style="display:block;padding:30px 0;"><h3>แสดงผลไม่สำเร็จ</h3><p>${e.message}</p></div>`;
  }
  document.getElementById('sheetBack').style.display = sheetStack.length > 1 ? 'flex' : 'none';
}
function freshSheet(renderFn){ sheetStack = []; pushSheet(renderFn); }
function goBackSheet(){
  sheetStack.pop();
  const prev = sheetStack[sheetStack.length-1];
  if(prev){
    prev();
    document.getElementById('sheetBack').style.display = sheetStack.length > 1 ? 'flex' : 'none';
  }else{
    document.getElementById('sheetOverlay').classList.remove('show');
  }
}
document.getElementById('sheetBack').addEventListener('click', goBackSheet);

function bindSheetLinks(){
  document.getElementById('shBody').querySelectorAll('.tpi-link[data-tpi]').forEach(el=>{
    el.addEventListener('click', ()=> pushSheet(()=>renderVehicleProfile(el.dataset.tpi)));
  });
  document.getElementById('shBody').querySelectorAll('.code-link[data-code]').forEach(el=>{
    el.addEventListener('click', ()=> pushSheet(()=>renderErrorProfile(el.dataset.code)));
  });
  document.getElementById('shBody').querySelectorAll('.mini-row[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> pushSheet(()=>renderDetail(el.dataset.id)));
  });
  document.getElementById('shBody').querySelectorAll('.mini-row[data-tpi]').forEach(el=>{
    el.addEventListener('click', ()=> pushSheet(()=>renderVehicleProfile(el.dataset.tpi)));
  });
}

function monthLabel(dateStr){
  if(!dateStr) return 'ไม่ระบุ';
  const m = dateStr.match(/(\d{4})-(\d{2})/) || dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(dateStr.includes('-')){
    const parts = dateStr.split('-');
    if(parts[0].length===4) return parts[0]+'-'+parts[1];
  }
  return dateStr.length>=7 ? dateStr.slice(0,7) : dateStr;
}

function renderDetail(id){
  clearCharts();
  const r = records.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('shTpi').innerHTML = `<span class="tpi-link" data-tpi="${r.tpiCode}">${r.tpiCode||'—'}</span>`;
  document.getElementById('shSub').textContent = `${r.date||''} ${r.timeFrom||''}${r.timeTo?'-'+r.timeTo:''} · WO ${r.workOrder||'—'}`;
  const row = (label, val) => `<div class="kv"><label>${label}</label><div class="v">${val || '<span style="color:var(--text-dim)">—</span>'}</div></div>`;
  const meta = sysMeta(r.system);
  document.getElementById('shBody').innerHTML = `
    ${diagramChipsHtml(r.tpiCode)}
    ${row('อาการ / รายละเอียด', r.symptom)}
    ${row('Error Code', r.errorCode ? `<span class="tpi-link code-link" data-code="${r.errorCode}">${r.errorCode}</span>` : '')}
    ${row('ระบบที่เกี่ยวข้อง', meta ? meta.l : 'ยังไม่ระบุ')}
    ${row('อุปกรณ์ต้นเหตุ', r.component)}
    ${row('สาเหตุเบื้องต้น', r.rootCauseInitial)}
    ${row('วิธีแก้ไขที่ทำ', r.fixMethod)}
    ${row('ผู้ซ่อม', r.technician)}
    ${row('ผลการซ่อม', r.resultStatus)}
    ${row('แก้หายถาวรหรือไม่', r.resolvedPermanent)}
    ${SHEET_EDIT_URL ? `<a class="edit-link" href="${SHEET_EDIT_URL}" target="_blank" rel="noopener">แก้ไขข้อมูลนี้ใน Google Sheet ↗</a>` : ''}
  `;
  bindSheetLinks();
}

function renderVehicleProfile(tpiCode){
  clearCharts();
  const list = records.filter(r => r.tpiCode === tpiCode).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  document.getElementById('shTpi').textContent = tpiCode || '—';
  document.getElementById('shSub').textContent = 'ประวัติ error ทั้งหมดของคันนี้';

  const unresolved = list.filter(r=>(r.resultStatus||'').includes('ไม่เสร็จ')).length;
  const distinctCodes = new Set(list.map(r=>r.errorCode).filter(Boolean)).size;

  const bySystem = {};
  list.forEach(r=>{ const k = r.system || 'UNSET'; bySystem[k] = (bySystem[k]||0)+1; });
  const byMonth = {};
  list.forEach(r=>{ const k = monthLabel(r.date); byMonth[k] = (byMonth[k]||0)+1; });
  const months = Object.keys(byMonth).sort();

  const byCode = {};
  list.forEach(r=>{
    if(!r.errorCode) return;
    byCode[r.errorCode] = byCode[r.errorCode] || {count:0, last:''};
    byCode[r.errorCode].count++;
    if(!byCode[r.errorCode].last || r.date > byCode[r.errorCode].last) byCode[r.errorCode].last = r.date;
  });
  const topCodes = Object.entries(byCode).sort((a,b)=>b[1].count-a[1].count);

  document.getElementById('shBody').innerHTML = `
    ${diagramChipsHtml(tpiCode)}
    <div class="profile-stats">
      <div class="pstat"><b>${list.length}</b><span>ครั้งทั้งหมด</span></div>
      <div class="pstat"><b>${unresolved}</b><span>ยังไม่เสร็จ</span></div>
      <div class="pstat"><b>${distinctCodes}</b><span>Error Code ต่างกัน</span></div>
    </div>

    <div class="profile-section">
      <h4>ความถี่การเกิด error รายเดือน</h4>
      <div class="chart-box"><canvas id="chVehTimeline"></canvas></div>
    </div>

    <div class="profile-section">
      <h4>แยกตามระบบ</h4>
      <div class="chart-box"><canvas id="chVehSystem"></canvas></div>
    </div>

    <div class="profile-section">
      <h4>Error Code ที่เกิดกับคันนี้</h4>
      <div class="mini-list">
        ${topCodes.length ? topCodes.map(([code, d]) => `
          <div class="mini-row code-link" data-code="${code}">
            <div><div class="mr-main">${code}</div><div class="mr-sub">ล่าสุด ${d.last||'—'}</div></div>
            <div class="mr-count">${d.count} ครั้ง</div>
          </div>`).join('') : '<div style="color:var(--text-dim);font-size:13.5px;">ไม่มี error code บันทึกไว้</div>'}
      </div>
    </div>

    <div class="profile-section">
      <h4>ประวัติทั้งหมด (${list.length})</h4>
      <div class="mini-list">
        ${list.map(r => `
          <div class="mini-row" data-id="${r.id}">
            <div><div class="mr-main">${r.symptom || r.errorCode || '—'}</div><div class="mr-sub">${r.date||''}${r.errorCode?' · '+r.errorCode:''}</div></div>
            <div class="mr-count">${r.resultStatus||''}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  bindSheetLinks();

  const sysColors = {HV:'#d70015',LV:'#0071e3',BMS:'#1a7f37',MOTOR:'#c2650a',CHARGE:'#8944ab',BRAKE:'#0a7a8c',UNSET:'#c7c7cc'};
  const sysLabels = {HV:'HV',LV:'LV',BMS:'BMS',MOTOR:'Motor/Inverter',CHARGE:'ชาร์จ',BRAKE:'เบรก',UNSET:'ยังไม่ระบุ'};

  safeChart('chVehTimeline', {
    type:'bar',
    data:{ labels: months, datasets:[{ data: months.map(m=>byMonth[m]), backgroundColor:'#0071e3', borderRadius:6, maxBarThickness:28 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}}, x:{grid:{display:false}} } }
  });
  const sysKeys = Object.keys(bySystem);
  safeChart('chVehSystem', {
    type:'bar',
    data:{ labels: sysKeys.map(k=>sysLabels[k]||k), datasets:[{ data: sysKeys.map(k=>bySystem[k]), backgroundColor: sysKeys.map(k=>sysColors[k]||'#c7c7cc'), borderRadius:6 }] },
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{ x:{beginAtZero:true, ticks:{precision:0}}, y:{grid:{display:false}} } }
  });
}

function renderErrorProfile(errorCode){
  clearCharts();
  const list = records.filter(r => r.errorCode === errorCode).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  document.getElementById('shTpi').textContent = errorCode || '—';
  document.getElementById('shSub').textContent = 'สรุป error code นี้ทั้งระบบ';

  const vehicles = {};
  list.forEach(r=>{ const k = r.tpiCode || 'ไม่ระบุ'; vehicles[k] = (vehicles[k]||0)+1; });
  const vehicleList = Object.entries(vehicles).sort((a,b)=>b[1]-a[1]);
  const resolvedPermanent = list.filter(r=>r.resolvedPermanent==='หายถาวร').length;

  const byMonth = {};
  list.forEach(r=>{ const k = monthLabel(r.date); byMonth[k] = (byMonth[k]||0)+1; });
  const months = Object.keys(byMonth).sort();

  const fixCounts = {};
  list.forEach(r=>{
    if(!r.fixMethod) return;
    fixCounts[r.fixMethod] = (fixCounts[r.fixMethod]||0)+1;
  });
  const fixList = Object.entries(fixCounts).sort((a,b)=>b[1]-a[1]);

  document.getElementById('shBody').innerHTML = `
    <div class="profile-stats">
      <div class="pstat"><b>${list.length}</b><span>ครั้งทั้งหมด</span></div>
      <div class="pstat"><b>${vehicleList.length}</b><span>คันที่เกิด</span></div>
      <div class="pstat"><b>${resolvedPermanent}</b><span>แก้หายถาวร</span></div>
    </div>

    <div class="profile-section">
      <h4>ความถี่การเกิดรายเดือน</h4>
      <div class="chart-box"><canvas id="chCodeTimeline"></canvas></div>
    </div>

    <div class="profile-section">
      <h4>รถที่เกิด error นี้</h4>
      <div class="mini-list">
        ${vehicleList.map(([tpi, c]) => `
          <div class="mini-row" data-tpi="${tpi}">
            <div class="mr-main">${tpi}</div>
            <div class="mr-count">${c} ครั้ง</div>
          </div>`).join('')}
      </div>
    </div>

    ${fixList.length ? `
    <div class="profile-section">
      <h4>วิธีแก้ไขที่เคยใช้</h4>
      <div class="mini-list">
        ${fixList.map(([fix, c]) => `
          <div class="mini-row" style="cursor:default;">
            <div class="mr-main" style="font-weight:400;">${fix}</div>
            <div class="mr-count">${c} ครั้ง</div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    <div class="profile-section">
      <h4>ประวัติทั้งหมด (${list.length})</h4>
      <div class="mini-list">
        ${list.map(r => `
          <div class="mini-row" data-id="${r.id}">
            <div><div class="mr-main">${r.tpiCode||'—'}</div><div class="mr-sub">${r.date||''}</div></div>
            <div class="mr-count">${r.resultStatus||''}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  bindSheetLinks();

  safeChart('chCodeTimeline', {
    type:'bar',
    data:{ labels: months, datasets:[{ data: months.map(m=>byMonth[m]), backgroundColor:'#0071e3', borderRadius:6, maxBarThickness:28 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}}, x:{grid:{display:false}} } }
  });
}

function openSheet(id){ freshSheet(()=>renderDetail(id)); }
function openVehicleProfile(tpi){ freshSheet(()=>renderVehicleProfile(tpi)); }
function openErrorProfile(code){ freshSheet(()=>renderErrorProfile(code)); }

document.getElementById('sheetClose').addEventListener('click', ()=>document.getElementById('sheetOverlay').classList.remove('show'));
document.getElementById('sheetOverlay').addEventListener('click', e=>{
  if(e.target.id === 'sheetOverlay') e.currentTarget.classList.remove('show');
});

['searchInput'].forEach(id=>document.getElementById(id).addEventListener('input', render));

loadData(false);
</script>
